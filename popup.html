<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            margin: 0;
        }

        .setting-group {
            margin-bottom: 10px;
        }

        .plan-section {
            border: 1px solid #d8dee4;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .plan-section.free {
            border-color: #c9d8ff;
            background: #f8faff;
        }

        .plan-section.pro {
            border-color: #e7d5ae;
            background: #fffdf5;
        }

        .plan-header {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .plan-title {
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            color: #24292f;
        }

        .plan-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .plan-badge.free {
            color: #0550ae;
            background: #ddf4ff;
            border-color: #96d0ff;
        }

        .plan-badge.pro {
            color: #9a6700;
            background: #fff8c5;
            border-color: #eedf8b;
        }

        .plan-section .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #24292f;
            font-size: 12px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .radio-option:hover {
            background-color: #f6f8fa;
        }

        .radio-option input[type="radio"] {
            margin: 0;
        }

        .radio-option label {
            cursor: pointer;
            margin: 0;
            flex: 1;
            font-size: 12px;
            line-height: 1.3;
        }

        .checkbox-option {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .checkbox-option:hover {
            background-color: #f6f8fa;
        }

        .checkbox-option input[type="checkbox"] {
            margin: 2px 0 0;
        }

        .checkbox-option label {
            font-size: 12px;
            line-height: 1.3;
            cursor: pointer;
            margin: 0;
            flex: 1;
        }

        .example {
            font-size: 10px;
            color: #656d76;
            margin-left: 0;
            margin-top: 1px;
        }

        .example-inline {
            font-size: 10px;
            color: #656d76;
            font-weight: normal;
        }

        .format-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            font-size: 12px;
            background-color: #ffffff;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .format-input:hover {
            border-color: #8c959f;
        }

        .format-input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }

        .format-help {
            font-size: 10px;
            color: #656d76;
            margin-top: 4px;
            line-height: 1.4;
        }

        .field-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .field {
            flex: 1;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: #57606a;
            margin-bottom: 4px;
        }

        .field input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 12px;
            line-height: 1.2;
        }

        .field input[type="number"]:focus {
            border-color: #0969da;
            outline: none;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }

        .field input[disabled] {
            background-color: #f6f8fa;
            color: #8c959f;
        }

        .hint {
            margin-top: 6px;
            font-size: 10px;
            color: #656d76;
            line-height: 1.4;
        }

        .gate-card {
            border: 1px solid #d8dee4;
            border-radius: 6px;
            padding: 8px;
            background: #f6f8fa;
        }

        .gate-title {
            margin: 0 0 8px;
            font-size: 10px;
            font-weight: 400;
            color: #656d76;
            line-height: 1.4;
        }

        .gate-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 12px;
            margin-bottom: 6px;
            background: #ffffff;
        }

        .gate-input:focus {
            border-color: #0969da;
            outline: none;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }

        .gate-button {
            width: 100%;
            border: 1px solid #1f6feb;
            border-radius: 4px;
            background: #1f6feb;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 8px;
            cursor: pointer;
        }

        .gate-button:hover {
            background: #1a62dc;
        }

        .gate-button:disabled {
            border-color: #8c959f;
            background: #8c959f;
            cursor: not-allowed;
        }

        .gate-button.secondary {
            margin-top: 6px;
            background: #ffffff;
            color: #1f6feb;
            border-color: #1f6feb;
        }

        .gate-button.secondary:hover {
            background: #f0f7ff;
        }

        .gate-status {
            margin-top: 6px;
            font-size: 11px;
            line-height: 1.35;
            display: none;
        }

        .gate-status.info {
            color: #57606a;
            display: block;
        }

        .gate-status.success {
            color: #1a7f37;
            display: block;
        }

        .gate-status.error {
            color: #cf222e;
            display: block;
        }

        .gate-meta {
            margin-top: 6px;
            font-size: 10px;
            color: #656d76;
            line-height: 1.4;
        }

        .registered-panel {
            border: 1px solid #a2f0ba;
            border-radius: 6px;
            padding: 6px 8px;
            background: #edfff3;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: nowrap;
            display: none;
            font-size: 11px;
            color: #0d1117;
            line-height: 1.35;
        }

        .registered-label {
            margin: 0;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-button {
            border: none;
            padding: 0;
            background: transparent;
            color: #0969da;
            font-size: 11px;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .locked-note {
            margin-top: 4px;
            font-size: 10px;
            color: #b54708;
            display: none;
        }

        .staleness-advanced {
            margin-top: 6px;
            display: none;
        }

        .status {
            margin-top: 8px;
            padding: 6px;
            border-radius: 4px;
            font-size: 10px;
            text-align: center;
            display: none;
        }

        .status.success {
            background-color: #d1f7c4;
            color: #0d1117;
            border: 1px solid #a2f0ba;
        }

        .status.error {
            background-color: #fef2f2;
            color: #0d1117;
            border: 1px solid #fecaca;
        }
    </style>
</head>

<body>
    <div class="setting-group">
        <div class="plan-section free">
            <div class="plan-header">
                <span class="plan-badge free">FREE</span>
                <p class="plan-title">Time Display</p>
            </div>

            <div class="setting-group">
                <label class="setting-label">Time Format</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="format-12h" name="timeFormat" value="12h">
                        <label for="format-12h">12-hour format <span class="example-inline">(4:25 PM)</span></label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="format-24h" name="timeFormat" value="24h">
                        <label for="format-24h">24-hour format <span class="example-inline">(16:25)</span></label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="format-auto" name="timeFormat" value="auto">
                        <label for="format-auto">Auto <span class="example-inline">(based on locale)</span></label>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Date Format (Optional)</label>
                <input type="text" id="dateFormat" class="format-input" placeholder="auto">
                <div class="format-help">
                    Leave empty or "auto" for locale format. Use YY (2-digit year), e.g. YY/MM/DD.
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Highlight Timestamps</label>
                <div class="radio-option">
                    <input type="checkbox" id="colorByDay">
                    <label for="colorByDay">
                        Color-code timestamps by day
                        <div class="example">Same day shares same color</div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="plan-section pro">
        <div class="plan-header">
            <span class="plan-badge pro">PRO</span>
            <p class="plan-title">Staleness Badges</p>
        </div>

        <div class="setting-group gate-card" id="registrationWall">
            <p class="gate-title">Unlock staleness badges.</p>
            <input type="email" id="leadEmail" class="gate-input" placeholder="you@company.com" autocomplete="email">
            <button type="button" id="registerLeadButton" class="gate-button">Register & Unlock</button>
            <button type="button" id="checkVerificationButton" class="gate-button secondary" style="display:none;">Check Verification Status</button>
            <div class="gate-status" id="registerLeadStatus"></div>
            <div class="gate-meta">Email is used for verification and product updates.</div>
        </div>

        <div class="setting-group registered-panel" id="registrationComplete">
            <span class="registered-label">Pro unlocked for <strong id="registeredEmail"></strong></span>
            <button type="button" id="resetRegistrationButton" class="link-button">Reset</button>
        </div>

        <div class="setting-group">
            <div class="checkbox-option">
                <input type="checkbox" id="stalenessEnabled">
                <label for="stalenessEnabled">Enable staleness badges (PR/Issue pages only)</label>
            </div>
            <div class="staleness-advanced" id="stalenessAdvancedOptions">
                <div class="field-row">
                    <div class="field">
                        <label for="stalenessWarnDays">Warning days</label>
                        <input type="number" id="stalenessWarnDays" min="1" step="1">
                    </div>
                    <div class="field">
                        <label for="stalenessCriticalDays">Critical days</label>
                        <input type="number" id="stalenessCriticalDays" min="1" step="1">
                    </div>
                </div>
            </div>
            <div class="locked-note" id="stalenessLockedNote">Register above to use Pro controls.</div>
        </div>
    </div>

    <div class="status" id="status"></div>

    <script src="lead-config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
